<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NordicBike A/S</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; line-height: 1.6; }
    main { max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #176b45; }
    .status { background: #e6f4ea; padding: 12px; }

    /* Topbar med ikoner */
    .topbar { background: #176b45; color: #fff; }
    .topbar-inner { max-width: 800px; margin: 0 auto; padding: 10px 20px;
                    display: flex; align-items: center; justify-content: space-between;
                    flex-wrap: wrap; gap: 10px; }
    .logo { display: flex; align-items: center; gap: 8px;
            font-weight: bold; font-size: 1.1em; color: #fff; text-decoration: none; }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav a { display: flex; flex-direction: column; align-items: center;
             color: #fff; text-decoration: none; font-size: 0.8em;
             padding: 6px 10px; border-radius: 6px; }
    .nav a:hover, .nav a:focus { background: rgba(255,255,255,0.15); }
    .icon { width: 24px; height: 24px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#">
        <!-- Cykel-ikon -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/>
          <path d="M5.5 17 9 9h6l3.5 8M9 9l3 8h-6.5M15 9l-1.5-3H11"/>
        </svg>
        NordicBike
      </a>
      <nav class="nav" aria-label="Hovedmenu">
        <a href="#">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/>
          </svg>
          Forside
        </a>
        <a href="#">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 4h2l2.5 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>
          </svg>
          Webshop
        </a>
        <a href="#">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>
          </svg>
          Service
        </a>
        <a href="#">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>
          </svg>
          Kontakt
        </a>
      </nav>
    </div>
  </header>

  <main>
    <h1>NordicBike A/S</h1>
    <p>Cykler, service og reparation</p>
    <h2>Velkommen til vores webshop</h2>
    <p>Vi hjælper dig med at komme videre på cykel.</p>
    <div class="status">Version 0.3 – NordicBike er opdateret for anden gang i Cloud!</div>
  </main>
</body>
</html>
